# Hyprland 0.56 compatibility fallback. Hyprland 0.57 uses hyprland.lua.

monitor=DP-3,3440x1440@59.97,3515x0,1.0,transform,2
monitor=HDMI-A-1,1920x1080@60.0,721x1800,1.0
monitor=DP-2,5120x1440@240.0,2641x1440,1.0,bitdepth,10

$terminal = kitty
$fileManager = thunar
$menu = wofi
$calculator = wofi-calc
$browser = librewolf
$reloadWaybar = pkill waybar && hyprctl dispatch exec waybar
$screenshot = hyprshot -m region -o ~/Pictures/Screenshots
$exit = command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
$reloadHyprland = command -v hyprctl reload

exec-once = hyprpaper & hypridle & hyprlock & hyprsunset
exec-once = waybar
exec-once = swaync -c ~/.config/swaync/config.json

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORs,1

general {
    gaps_in = 5
    gaps_out = 1
    border_size = 3
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 1, default
    animation = border, 1, 1.39, easeOutQuint
    animation = windows, 1, 10, easeInOutCubic, popin 20%
    animation = windowsIn, 1, 10, easeOutQuint, popin 80%
    animation = windowsOut, 1, 10, easeOutQuint, popin 20%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2.94, almostLinear, fade
    animation = workspacesIn, 1, 2.21, almostLinear, fade
    animation = workspacesOut, 1, 2.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = false
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

$mainmod = super
bind = $mainmod, q, exec, $terminal
bind = $mainmod, c, killactive,
bind = $mainmod, k, exec, bash -c "hyprlock & sudo /usr/local/bin/mounts -um"
bind = $mainmod, e, exec, $fileManager
bind = $mainmod, space, exec, $menu
bind = $mainmod shift, space, exec, $calculator
bind = $mainmod, p, pseudo,
bind = $mainmod, f, exec, $browser
bind = $mainmod, b, exec, $reloadWaybar
bind = $mainmod shift, f4, exec, $screenshot
bind = $mainmod, g, exec, google-chrome-stable
bind = $mainmod shift, g, exec, bash ~/.config/hypr/toggle-side-monitors.sh
bind = $mainmod shift, h, swapwindow, l
bind = $mainmod shift, l, swapwindow, r
bind = $mainmod shift, k, movewindow, u
bind = $mainmod shift, j, movewindow, d
bind = $mainmod shift, i, exec, $exit
bind = $mainmod, m, exec, $reloadHyprland
bind = $mainmod, h, movefocus, l
bind = $mainmod, l, movefocus, r
bind = $mainmod, k, movefocus, u
bind = $mainmod, j, movefocus, d

bind = $mainmod, 1, workspace, 1
bind = $mainmod, 2, workspace, 2
bind = $mainmod, 3, workspace, 3
bind = $mainmod, 4, workspace, 4
bind = $mainmod, 5, workspace, 5
bind = $mainmod, 6, workspace, 6
bind = $mainmod, 7, workspace, 7
bind = $mainmod, 8, workspace, 8
bind = $mainmod, 9, workspace, 9
bind = $mainmod, 0, workspace, 10
bind = $mainmod shift, 1, movetoworkspace, 1
bind = $mainmod shift, 2, movetoworkspace, 2
bind = $mainmod shift, 3, movetoworkspace, 3
bind = $mainmod shift, 4, movetoworkspace, 4
bind = $mainmod shift, 5, movetoworkspace, 5
bind = $mainmod shift, 6, movetoworkspace, 6
bind = $mainmod shift, 7, movetoworkspace, 7
bind = $mainmod shift, 8, movetoworkspace, 8
bind = $mainmod shift, 9, movetoworkspace, 9
bind = $mainmod shift, 0, movetoworkspace, 10
bind = $mainmod, s, togglespecialworkspace, magic
bind = $mainmod shift, s, movetoworkspace, special:magic
bind = $mainmod, mouse_down, workspace, e+1
bind = $mainmod, mouse_up, workspace, e-1
bindm = $mainmod, mouse:272, movewindow
bindm = $mainmod, mouse:273, resizewindow
bindl = , xf86audionext, exec, playerctl next
bindl = , xf86audiopause, exec, playerctl play-pause
bindl = , xf86audioplay, exec, playerctl play-pause
bindl = , xf86audioprev, exec, playerctl previous

workspace=1, monitor:DP-2, persistent:true, default:true
workspace=4, monitor:DP-2
workspace=7, monitor:DP-2
workspace=10, monitor:DP-2
workspace=11, monitor:DP-2
workspace=12, monitor:DP-2
workspace=13, monitor:DP-2
workspace=14, monitor:DP-2
workspace=15, monitor:DP-2
workspace=2, monitor:DP-3, persistent:true, default:true
workspace=5, monitor:DP-3
workspace=8, monitor:DP-3
workspace=3, monitor:HDMI-A-1, persistent:true, default:true
workspace=6, monitor:HDMI-A-1
workspace=9, monitor:HDMI-A-1

windowrule = match:class ^(signal)$, workspace 5
windowrule = match:class ^(spotify)$, workspace 5
windowrule = match:class (chrome), workspace 3
windowrule = match:class ^(Signal)$, workspace 5
windowrule = match:class ^(Spotify)$, workspace 5
windowrule = match:class ^(Steam)$, workspace 4
windowrule = match:class ^(google-chrome)$, workspace 3
windowrule = suppress_event maximize, match:class .*
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus true
